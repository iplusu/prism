[project]
name = "prism-backend"
version = "0.1.0"
description = "Local research writing workspace: LaTeX projects, sandboxed compilation, Qwen-orchestrated agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.6",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "websockets==17.3",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "pypdf==5.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.uv]
package = false
