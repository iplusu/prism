# Reverse proxy: one origin for the UI, API, SSE and the collaboration WebSocket.
# /internal/* is service-to-service only and must never be exposed.
upstream prism_web    { server web:8000; }
upstream prism_collab { server collab:1234; }

server {
    listen 80;
    server_name _;
    client_max_body_size 110m;

    location ^~ /internal/ { return 404; }

    location /collab/ {
        proxy_pass http://prism_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location ~ ^/api/tasks/[^/]+/stream$ {
        proxy_pass http://prism_web;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://prism_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
