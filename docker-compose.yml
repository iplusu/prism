# Prism production stack. Build: docker compose build ; run: docker compose up -d
# Browser entry point: http://<server>:${PRISM_HTTP_PORT:-8080}
# Not executed on the development host (no Docker there) — see docs/deployment.md.
name: prism

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://prism:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/prism
    PRISM_DATA_DIR: /srv/prism/data
    COLLAB_INTERNAL_URL: http://collab:1234
    COLLAB_PUBLIC_URL: ""

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: prism
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U prism"], interval: 5s, retries: 20 }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/backend.Dockerfile, target: web }
    <<: *backend-env
    depends_on: { db: { condition: service_healthy } }
    volumes: [prismdata:/srv/prism/data]
    # egress: the Settings → "Test connection" check calls the LLM server from here.
    networks: [internal, egress]     # no Docker socket, no TeX, no agent CLIs
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Compiles and proposal verification/apply. No internet access.
  compile-worker:
    build: { context: ., dockerfile: deploy/backend.Dockerfile, target: worker }
    <<: *backend-env
    command: ["python", "-m", "app.worker", "--kinds", "compile,verify_proposal,apply_proposal"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [prismdata:/srv/prism/data]
    networks: [internal]
    # bubblewrap needs unprivileged user namespaces inside the container.
    security_opt: [seccomp=unconfined, apparmor=unconfined]
    cap_drop: [ALL]
    pids_limit: 2048
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped

  # Orchestrated agent tasks: talks to the LLM server and runs Codex / Claude Code / Antigravity.
  agent-worker:
    build: { context: ., dockerfile: deploy/backend.Dockerfile, target: worker }
    <<: *backend-env
    command: ["python", "-m", "app.worker", "--kinds", "agent"]
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - prismdata:/srv/prism/data
      # Tool logins live in the data volume (tool-homes/); see docs/agent-adapters.md
    networks: [internal, egress]
    security_opt: [seccomp=unconfined, apparmor=unconfined]
    cap_drop: [ALL]
    pids_limit: 2048
    mem_limit: 8g
    restart: unless-stopped

  collab:
    build: { context: ., dockerfile: deploy/collab.Dockerfile }
    env_file: .env
    environment:
      BACKEND_INTERNAL_URL: http://web:8000
      COLLAB_DATA_DIR: /srv/prism/collab
    volumes: [collabdata:/srv/prism/collab]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  proxy:
    image: nginx:1.28.0-alpine
    volumes: [./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["${PRISM_HTTP_PORT:-8080}:80"]
    depends_on: [web, collab]
    networks: [internal, public]
    restart: unless-stopped

networks:
  internal: { internal: true }   # no route to the internet
  egress: {}                      # agent-worker -> LLM server and tool vendor APIs
  public: {}

volumes:
  pgdata:
  prismdata:
  collabdata:
